modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/BugQuantumCore/Joban-Client-Mod-Yanyang/issues"

[[mods]]
modId = "jsblock"
version = "${mod_version}"
displayName = "Joban Client Mod"
authors = "AmberFrost, 1081MTR, AozoraSky, StrikeSNC, Dooji, Jonathan Ho, CinderaceOTS, BugQuantumCore"
description = "Railway facilities & technical addon for Minecraft Transit Railway 4.1."
logoFile = "assets/jsblock/icon.png"
# Fabric allows a client with JCM to join a server without it; mirror that.
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "jsblock.mixins.json"

[[mixins]]
config = "mtrscripting.mixins.json"

[[dependencies.jsblock]]
modId = "neoforge"
type = "required"
ordering = "NONE"
side = "BOTH"

[[dependencies.jsblock]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.jsblock]]
modId = "mtr"
type = "required"
versionRange = "(4.0.6,4.2)"
ordering = "NONE"
side = "BOTH"

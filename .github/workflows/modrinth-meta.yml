name: Modrinth Meta (one-shot)

on:
  push:
    branches: [ci/modrinth-upload]
    paths: ['.github/workflows/modrinth-meta.yml', '.github/modrinth-description.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout description file
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/modrinth-description.md

      - name: Patch project description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os, urllib.error, urllib.request

          TOK = os.environ["MODRINTH_TOKEN"]
          UA = "jcm-yanyang-meta/1.0 (BugQuantumCore)"

          def req(url, data=None, method="GET"):
              r = urllib.request.Request(url, data=data, method=method, headers={
                  "User-Agent": UA, "Authorization": TOK, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=120) as resp:
                      body = resp.read()
                      return json.loads(body.decode()) if body else None
              except urllib.error.HTTPError as e:
                  detail = ""
                  try:
                      detail = e.read().decode(errors="replace")[:1000]
                  except Exception:
                      pass
                  raise RuntimeError(f"HTTP {e.code} for {method} {url}: {detail}")

          proj = req("https://api.modrinth.com/v2/project/kMMJcRqY")
          old = proj.get("description") or ""
          print(f"current description: {len(old)} chars; head: {old[:120]!r}")

          new = open(".github/modrinth-description.md", encoding="utf-8").read()
          short = ("Joban Client Mod Yanyang 分支：为 Minecraft Transit Railway 4 带来 "
                   "JS + C++ 混合脚本、零 JNI 传输与渲染性能修复。")
          print(f"new body: {len(new)} chars; short description: {len(short)} chars")
          assert 0 < len(new) < 65536 and 0 < len(short) < 256, "length out of range"

          out = req(f"https://api.modrinth.com/v2/project/{proj['id']}",
                    data=json.dumps({"description": short, "body": new}).encode(),
                    method="PATCH")
          print("PATCH accepted:", json.dumps(out)[:200] if out else "(204 no content)")

          got = req("https://api.modrinth.com/v2/project/kMMJcRqY")
          assert (got.get("body") or "") == new, \
              f"body mismatch after PATCH: {len(got.get('body') or '')} vs {len(new)} chars"
          assert (got.get("description") or "") == short, "short description mismatch"
          print(f"VERIFIED: project body ({len(new)} chars) and description updated")
          PYEOF

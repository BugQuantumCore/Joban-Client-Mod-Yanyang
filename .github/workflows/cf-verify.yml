name: CF Verify (one-shot)

on:
  push:
    branches: [ci/modrinth-upload]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify yanyang.7 files on CurseForge via public mirror
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, sys, time, urllib.request

          UA = "jcm-yanyang-verify/1.0 (BugQuantumCore)"
          PROJECT = "1736483"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return json.loads(r.read().decode())

          files = []
          for attempt in range(10):
              try:
                  d = get(f"https://api.cfwidget.com/{PROJECT}")
                  files = d.get("files", [])
                  print(f"cfwidget: {len(files)} files listed (attempt {attempt})")
                  if any("2.3.0-beta-2.yanyang.7" in (f.get("name") or "") for f in files):
                      break
              except Exception as e:
                  print(f"cfwidget poll error (attempt {attempt}): {e}")
              time.sleep(30)

          new = [f for f in files if "2.3.0-beta-2.yanyang.7" in (f.get("name") or "")]
          print(f"new yanyang.7 files visible: {len(new)}")
          for f in new:
              print(f"  - {f.get('name')} | {f.get('uploaded_at')} | id {f.get('id')}")

          print(f"total files on project (mirror view): {len(files)}")
          recent = sorted(files, key=lambda f: f.get("uploaded_at") or "", reverse=True)[:15]
          print("newest 15 files in mirror:")
          for f in recent:
              print(f"  - {f.get('name')} | {f.get('uploaded_at')}")

          if len(new) != 12:
              print("EXPECTED 12 NEW FILES — mirror cache may lag; mc-publish success logs are authoritative")
              sys.exit(1)
          print("ALL 12 NEW FILES VISIBLE VIA PUBLIC MIRROR")
          PYEOF

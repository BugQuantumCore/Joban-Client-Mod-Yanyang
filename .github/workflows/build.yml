name: MTR 4.1 Port Build
on:
  push:
    branches: ['port/mtr-4.1.0']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mtr41-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  natives:
    # The ported C++ part of the mod (native/ — the jcm_native_bridge FFM
    # bridge and the native script SDK) compiles and tests on every push,
    # alongside the Java matrix below. The CMake suite includes the ABI
    # layout checks and the real-JVM integration tests; the full six-OS
    # sweep (plus the cross legs) stays in the manually dispatched Native
    # SDK Tests workflow, and the eight-platform bridge bundling belongs to
    # the Complete Build / Release Build pipelines.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NATIVE_TEST_PLATFORM: linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test the native SDK
        run: |
          set -euo pipefail
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release --parallel 4
          ctest --test-dir native/build -C Release --output-on-failure -LE jvm_port_pending
  build:
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.4']
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Yanyang: the mod and the Yanyang MTR builds run on Java 25 —
          # build the jars on a JDK 25 daemon (Gradle 9.5.1 fully supports
          # it; bytecode targets stay at options.release = 21).
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Download pinned MTR with its matching TSC
        env:
          MC: ${{ matrix.minecraft }}
          LOADER: ${{ matrix.loader }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          NAME=$(jq -r --arg key "$MC-$LOADER" '.artifacts[$key].name' gradle/mtr41-lock.json)
          SHA=$(jq -r --arg key "$MC-$LOADER" '.artifacts[$key].sha256' gradle/mtr41-lock.json)
          TAG=$(jq -r .tag gradle/mtr41-lock.json)
          gh release download "$TAG" --repo BugQuantumCore/MTR-Yanyang --pattern "$NAME" --dir dependencies
          printf '%s  %s\n' "$SHA" "dependencies/$NAME" | sha256sum --check --strict
          mv "dependencies/$NAME" "dependencies/mtr-$MC-$LOADER.jar"
      - name: Compile and package against the real target API
        env:
          MC: ${{ matrix.minecraft }}
          LOADER: ${{ matrix.loader }}
        run: bash ./gradlew ":$LOADER:build" -Pminecraft_version="$MC" -Ptarget_loader="$LOADER" --stacktrace --console=plain --max-workers=2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: JCM-MTR41-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: build/*.jar
          if-no-files-found: error

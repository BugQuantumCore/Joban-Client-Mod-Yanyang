name: Release Build
on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Release type
        required: true
        options: [beta, release]
      publish-tag:
        type: string
        required: true
        description: Version without the v prefix
permissions:
  contents: read
env:
  RELEASE_VERSION: ${{ inputs.publish-tag }}
jobs:
  model-upload:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify model coordinates and the MTR 4.1 upload contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p native/build-gl
          TAG=$(jq -r .tag gradle/mtr41-lock.json)
          NAME=$(jq -r '.artifacts["1.21.1-neoforge"].name' gradle/mtr41-lock.json)
          SHA=$(jq -r '.artifacts["1.21.1-neoforge"].sha256' gradle/mtr41-lock.json)
          gh release download "$TAG" --repo BugQuantumCore/MTR-Yanyang --pattern "$NAME" --dir native/build-gl
          printf '%s  %s\n' "$SHA" "native/build-gl/$NAME" | sha256sum --check --strict
          mv "native/build-gl/$NAME" native/build-gl/mtr.jar
          python3 native/bench/model_upload_test.py --mtr-jar native/build-gl/mtr.jar --work native/build-gl/test
  natives:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            java-arch: x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            java-arch: aarch64
          - os: windows-latest
            platform: windows-x64
            java-arch: x64
          - os: windows-11-arm
            platform: windows-arm64
            java-arch: aarch64
            python-version: '3.13'
          - os: macos-15-intel
            platform: macos-x64
            java-arch: x64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: macos-latest
            platform: macos-arm64
            java-arch: aarch64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          # Cross builds: the produced image cannot run on the build host,
          # so the JVM ctest suite is skipped there (source-level checks
          # still run on the six native-platform jobs). Compilation itself
          # still builds every probe and static-assert target.
          - os: ubuntu-latest
            platform: android-arm64
            cross: android
            cmake-arch: -DCMAKE_ANDROID_ABI=arm64-v8a
          # iOS cross-compiles against the iPhoneOS SDK, which ships in the
          # arm runner's Xcode too — and ctest is already skipped for cross
          # legs. The 2026-10-28/30 macos-latest (arm) provisioning outage
          # that forced the macos-15-intel pin has cleared; build on the arm
          # image again (user-requested runner).
          - os: macos-latest
            platform: ios-arm64
            cross: ios
            cmake-arch: -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_TEST_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          architecture: ${{ matrix.java-arch || 'x64' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version || '3.12' }}
      - name: Configure and build CMake targets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "android" ]; then
            # Cross-compile against the preinstalled NDK (arm64-v8a,
            # Android 5.0+ / API 21). The bridge is JDK-free, so nothing
            # comes from a JVM — no jni.h anywhere.
            NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
            echo "Using NDK: $NDK"
            cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 ${{ matrix.cmake-arch }}
          elif [ "${{ matrix.cross }}" = "ios" ]; then
            # Cross-compile a Mach-O arm64 dylib against the iPhoneOS SDK.
            # The bridge is JDK-free; side-loaders re-sign the image, so no
            # signing identity here.
            cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-arch }}
          else
            cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-arch }}
          fi
          cmake --build native/build --config Release --parallel 4
      - name: Verify scripts, ABI layout and real JVM integration
        if: matrix.cross == ''
        run: ctest --test-dir native/build -C Release --output-on-failure -LE jvm_port_pending
      - name: Collect bridge and generic example libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/bridges/${{ matrix.platform }}" "dist/examples/${{ matrix.platform }}"
          find native/build -type f \( -name '*jcm_native_bridge.dll' -o -name '*jcm_native_bridge.so' -o -name '*jcm_native_bridge.dylib' \) -exec cp {} "dist/bridges/${{ matrix.platform }}/" \;
          for module in pids_arrivals eyecandy_signal lift_indicator; do
            find native/build -type f \( -name "$module.dll" -o -name "lib$module.so" -o -name "lib$module.dylib" \) -exec cp {} "dist/examples/${{ matrix.platform }}/" \;
          done
          test "$(find dist/bridges -type f | wc -l | tr -d ' ')" = 1
          test "$(find dist/examples -type f | wc -l | tr -d ' ')" = 3
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  build:
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.4']
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Download pinned MTR with its matching TSC
        env:
          MC: ${{ matrix.minecraft }}
          LOADER: ${{ matrix.loader }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependencies
          NAME=$(jq -r --arg key "$MC-$LOADER" '.artifacts[$key].name' gradle/mtr41-lock.json)
          SHA=$(jq -r --arg key "$MC-$LOADER" '.artifacts[$key].sha256' gradle/mtr41-lock.json)
          TAG=$(jq -r .tag gradle/mtr41-lock.json)
          gh release download "$TAG" --repo BugQuantumCore/MTR-Yanyang --pattern "$NAME" --dir dependencies
          printf '%s  %s\n' "$SHA" "dependencies/$NAME" | sha256sum --check --strict
          mv "dependencies/$NAME" "dependencies/mtr-$MC-$LOADER.jar"
      - name: Build the module with all eight native bridges
        env:
          MC: ${{ matrix.minecraft }}
          LOADER: ${{ matrix.loader }}
        run: |
          chmod +x ./gradlew
          # Maven read-timeouts are transient — retry before failing the matrix leg.
          try() {
            local n=0
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then return 1; fi
              echo "::warning::gradle attempt ${n} failed; retrying in 30s"
              sleep 30
            done
          }
          try ./gradlew ":$LOADER:build" -Pminecraft_version="$MC" -Ptarget_loader="$LOADER" -Pmod_version="$RELEASE_VERSION" -Pnative_bridge_dir=native-dist/bridges --console=plain --max-workers=2
      - name: Audit documented Java API declarations
        # The audited script-facing types all live in the loader-neutral shared
        # sources, so the NeoForge legs (which consume the pinned MTR jar
        # un-remapped, in Mojang mappings) carry the audit for both loaders.
        if: matrix.loader == 'neoforge'
        env:
          MC: ${{ matrix.minecraft }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, sys, json
          sys.path.insert(0,'native/bench')
          from api_coverage import audit
          jars=[Path('dependencies/mtr-' + os.environ['MC'] + '-neoforge.jar')]
          manifest=json.loads(Path('native/bench/api-coverage.json').read_text())
          audit(Path('neoforge/build/classes/java/main'), jars, manifest)
          PY
      - name: Verify jar contents and absence of user resource packs
        run: python3 native/bench/verify_jar.py --version "$RELEASE_VERSION" build/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.minecraft }}-${{ matrix.loader }}
          path: build/*.jar
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [build, model-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: release-jars
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Require all four jars and package a separate SDK
        run: |
          test "$(find release-jars -name '*.jar' -type f | wc -l)" -eq 4
          python3 - <<'PY'
          import os,subprocess,zipfile
          from pathlib import Path
          files=subprocess.check_output(['git','ls-files','native'],text=True).splitlines()
          with zipfile.ZipFile('jcm-native-sdk-' + os.environ['RELEASE_VERSION'] + '.zip','w',zipfile.ZIP_DEFLATED) as archive:
              archive.write('LICENSE')
              for name in files:
                  path=Path(name)
                  if path.is_file(): archive.write(path,path)
              for path in Path('native-dist/examples').rglob('*'):
                  if path.is_file(): archive.write(path,path.relative_to('native-dist'))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.publish-tag }}
          target_commitish: ${{ github.sha }}
          name: JCM v${{ inputs.publish-tag }}
          prerelease: ${{ inputs.release-type == 'beta' }}
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-jars/*.jar
            jcm-native-sdk-*.zip

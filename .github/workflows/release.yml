# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Release Build
on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Choose the release type
        required: true
        options:
          - beta
          - release
      publish-tag:
        type: string
        required: true
        description: Tag name to publish (X.X.X)

jobs:
  build:
    # Forks default to a read-only workflow token — release creation needs
    # explicit write permission (upstream relies on repo-wide settings).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        minecraft: [1.17.1, 1.18.2, 1.19.2, 1.19.4, 1.20.1, 1.20.4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Setup Forge files
        run: ./gradlew setupFiles -Pminecraft_version="${{ matrix.minecraft }}"
      - name: Build with Gradle
        run: |
          ./gradlew build -Pminecraft_version="${{ matrix.minecraft }}"
      - name: Create release
        uses: softprops/action-gh-release@v2.4.2
        with:
          body_path: CHANGELOG.md
          name: "JCM v${{ inputs.publish-tag }} — C++ Native Scripting Edition"
          draft: false
          tag_name: v${{ inputs.publish-tag }}
          prerelease: ${{ inputs.release-type == 'beta' }}
          fail_on_unmatched_files: true
          files: build/*.jar
      - name: Upload to Mod Distribution Platforms (Fabric)
        env:
          MODRINTH_KEY: ${{ secrets.MODRINTH_PAT }}
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_PAT }}
        if: ${{ (env.MODRINTH_KEY != '') && (env.CURSEFORGE_KEY != '') }}
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: lQqKCDhg
          curseforge-id: 1316710
          modrinth-token: ${{ secrets.MODRINTH_PAT }}
          curseforge-token: ${{ secrets.CURSEFORGE_PAT }}
          files: |
            build/*fabric*.jar
          name: '[Fabric ${{ matrix.minecraft }}] v${{ inputs.publish-tag }}'
          version: v${{ inputs.publish-tag }}+${{ matrix.minecraft }}
          version-type: ${{ inputs.release-type }}
          modrinth-featured: ${{ inputs.release-type == 'release' }}
          changelog-file: CHANGELOG.md

          loaders: |
            fabric
          game-versions: |
            ${{ matrix.minecraft }}

          dependencies: |
            minecraft-transit-railway
          retry-attempts: 3
          retry-delay: 30000
          fail-mode: fail
      - name: Upload to Mod Distribution Platforms (Forge)
        env:
           MODRINTH_KEY: ${{ secrets.MODRINTH_PAT }}
           CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_PAT }}
        if: ${{ (env.MODRINTH_KEY != '') && (env.CURSEFORGE_KEY != '') }}
        uses: Kira-NT/mc-publish@v3.3
        with:
         modrinth-id: lQqKCDhg
         curseforge-id: 1316710
         modrinth-token: ${{ secrets.MODRINTH_PAT }}
         curseforge-token: ${{ secrets.CURSEFORGE_PAT }}
         files: |
           build/*forge*.jar
         name: '[Forge ${{ matrix.minecraft }}] v${{ inputs.publish-tag }}'
         version: v${{ inputs.publish-tag }}+${{ matrix.minecraft }}
         version-type: ${{ inputs.release-type }}
         modrinth-featured: ${{ inputs.release-type == 'release' }}
         changelog-file: CHANGELOG.md
         loaders: |
           forge
           ${{ startsWith(matrix.minecraft, '1.20.1') && 'neoforge' || '' }}
         game-versions: |
           ${{ matrix.minecraft }}
         dependencies: |
           minecraft-transit-railway
         retry-attempts: 3
         retry-delay: 30000
         fail-mode: fail
      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: JCM for Minecraft ${{ matrix.minecraft }}
          path: build/

  natives:
    # Yanyang: build the C++ native script libraries for every desktop
    # platform on release, so the mod release and the prebuilt script
    # libraries it documents always stay in sync.
    name: natives ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # macos-13 (Intel) runners are being retired by GitHub — build the
          # x86_64 slice by cross-compiling on an arm runner.
          - os: macos-latest
            platform: macos-x64
            cmake-arch: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-arch }}

      - name: Build script libraries
        run: cmake --build native/build --config Release --parallel

      - name: Run jslcd smoke test (41 assertions)
        if: runner.os == 'Linux'
        working-directory: native/build
        run: ./jslcd_smoke

      - name: Collect script libraries
        shell: bash
        run: |
          set -euxo pipefail
          OUT="dist-${{ matrix.platform }}/assets/mtr/natives"
          mkdir -p "$OUT"
          case "${{ matrix.platform }}" in
            windows-*) find native/build -name '*.dll' -exec cp {} "$OUT" \; ;;
            macos-*)   find native/build -name '*.dylib' -exec cp {} "$OUT" \; ;;
            *)         find native/build -name '*.so' -exec cp {} "$OUT" \; ;;
          esac
          cp native/README.md "dist-${{ matrix.platform }}/"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mtr-native-scripts-${{ matrix.platform }}
          path: dist-${{ matrix.platform }}/
          if-no-files-found: error

  natives-release:
    # Attach the prebuilt native script libraries and the full C++ SDK
    # source bundle to the same GitHub release the mod jars went to.
    needs: [build, natives]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package native assets
        shell: bash
        run: |
          set -euxo pipefail
          for d in dist/mtr-native-scripts-*; do
            name="$(basename "$d")"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          # Full SDK source bundle (headers, examples, JNI bridge, smoke driver)
          zip -r dist/mtr-native-scripting-v3-sdk.zip native/ \
            -x 'native/build/*' 'native/build-ci/*' 'native/bench/*.so' \
               'native/bench/jslcd_smoke' 'native/bench/jslcd_perf' \
               'native/bench/lcd_bench' 'native/bench/gfx2d_bench' \
               'native/bench/smoke_test'
          ls -la dist/*.zip

      - uses: softprops/action-gh-release@v2.4.2
        with:
          files: |
            dist/mtr-native-scripts-*.zip
            dist/mtr-native-scripting-v3-sdk.zip
          tag_name: v${{ inputs.publish-tag }}

  publish:
    needs: [build, natives-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Read CHANGELOG.md
        run: |
          echo 'CHANGELOG<<EOF' >> $GITHUB_ENV
          echo "$(cat CHANGELOG.md)" >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
      - name: Publish announcement Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        # Skip instead of failing when the fork has no webhook configured.
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            <@&944884315853045764>
            ${{ env.CHANGELOG }}

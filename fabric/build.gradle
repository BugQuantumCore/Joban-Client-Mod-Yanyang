plugins {
    id 'fabric-loom' version "${loom_version}"
}

loom {
    runConfigs.configureEach { ideConfigGenerated = true }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

def yarn_version = project.properties["yarn_mappings_${rootProject.minecraft_version}"]
def fabric_api_version = project.properties["fabric_api_version_${rootProject.minecraft_version}"]
def mod_menu_version = project.properties["mod_menu_version_${rootProject.minecraft_version}"]

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    mappings loom.officialMojangMappings()
    // CI downloads and hash-verifies the exact Yanyang MTR release. Its jar
    // already contains the matching TSC; never shade a second simulation core.
    // A locally trimmed classes-only -compile.jar (same classes, assets/natives
    // stripped) may be used for faster offline compiles; CI always uses the full
    // pinned jar.
    def mtrJar = rootProject.file("dependencies/mtr-${rootProject.minecraft_version}-fabric-compile.jar")
    if (!mtrJar.exists()) {
        mtrJar = rootProject.file("dependencies/mtr-${rootProject.minecraft_version}-fabric.jar")
    }
    modImplementation files(mtrJar)
    // MTR-Yanyang bundles Elementa / UniversalCraft / Kotlin as jar-in-jar;
    // their classes appear in MTR screen signatures, so they must be on the
    // compile classpath too (provided at runtime by MTR's JiJ).
    // Elementa / UniversalCraft / Kotlin are provided at runtime as MTR's
    // jar-in-jar dependencies. For compilation we keep locally pre-remapped
    // (mojmap) copies on the compileOnly classpath: compileOnly keeps them
    // OFF the remapJar classpath, where they would otherwise collide with
    // the same classes loom extracts from MTR's nested META-INF/jars.
    compileOnly files(
        rootProject.file("dependencies/elementa-743-mojmap.jar"),
        rootProject.file("dependencies/universalcraft-1.21-fabric-497-mojmap.jar"),
        rootProject.file("dependencies/kotlin-stdlib-2.5.0-RC.jar"),
    )
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modApi "com.terraformersmc:modmenu:${mod_menu_version}"
    annotationProcessor "systems.manifold:manifold-preprocessor:${manifold_preprocessor}"
    include "folk.sisby:kaleido-config:${rootProject.properties.kaleido_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = java_version
}

configurations.configureEach {
    // Force use our version of mod-loader even if dependency requires a lower mod-loader so the game can launch
    // May cause problems, but they're usually backward compatible
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:$project.fabric_loader_version")
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
}

remapJar {
    dependsOn(shadowJar)
    mustRunAfter(shadowJar)
    inputFile = file(shadowJar.archiveFile)
    // The pre-remapped (mojmap) Elementa / UniversalCraft / Kotlin compile
    // stubs duplicate the copies loom expands out of MTR's nested
    // META-INF/jars, and tiny-remapper aborts with "duplicate method in
    // inputs". They are compile-only (provided at runtime by MTR's JiJ),
    // so drop them from the remap classpath.
    classpath = classpath.filter { f ->
        !f.name.contains('elementa') &&
        !f.name.contains('universalcraft') &&
        !f.name.contains('kotlin-stdlib')
    }
}

tasks.register("moveBuild") {
    doLast {
        delete fileTree("../build").matching {
            include "**/*fabric*"
        }
        copy {
            from "build/libs/JCM-fabric-${version}.jar"
            into "../build"
            rename { fileName -> fileName }
        }
    }
}

afterEvaluate {
    for (def task in it.tasks) {
        if (task == tasks.build) {
            task.finalizedBy tasks.moveBuild
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url "https://jitpack.io" }
}
